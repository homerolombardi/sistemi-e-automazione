name: Publicar Portal no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Construir e Publicar no GitHub
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 3. Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 4. Instalar dependências
        run: npm install

      - name: 5. Gerar versão de produção (Pasta out)
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: 6. Empacotar arquivos para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: 7. Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4