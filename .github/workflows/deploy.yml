name: Publicar Portal no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Construir e Publicar no GitHub
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 1. Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 3. Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 4. Instalar dependencias
        run: npm install

      - name: 5. Gerar versao de producao (Pasta out)
        env:
          NODE_ENV: production
        run: |
          npm run build
          touch ./out/.nojekyll

      - name: 6. Empacotar arquivos para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: 7. Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
